replicaCount: 1        

image:
  pullPolicy: IfNotPresent   

serviceAccount:
  create: true          

service:
  type: NodePort         
  port: 80               # service.yaml: Port des Service
  targetPort: 8000       # service.yaml: Port im Container (uvicorn)

ingress:
  enabled: false         # ingress.yaml: kein Ingress erstellen

autoscaling:
  enabled: false         # deployment.yaml + hpa.yaml: kein Autoscaling

probePath: /             # deployment.yaml: Health-Check-Pfad (per --set überschrieben)