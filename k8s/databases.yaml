apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: movie-db}
  template:
    metadata:
      labels: {app: movie-db}
    spec:
      securityContext:
        runAsUser: 70
        appArmorProfile:
          type: Unconfined
      containers:
        - name: postgres
          image: postgres:12-alpine
          env:
            - {name: POSTGRES_USER, value: movie_db_username}
            - {name: POSTGRES_PASSWORD, value: movie_db_password}
            - {name: POSTGRES_DB, value: movie_db_dev}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: movie-db
spec:
  selector: {app: movie-db}
  ports:
    - port: 5432
---
